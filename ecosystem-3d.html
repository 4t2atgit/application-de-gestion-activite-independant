<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 Écosystème 3D - micro-entreprise-suivi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
            overflow: hidden;
        }
        .main-container {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 150px);
            gap: 0;
        }
        #canvas {
            flex: 1;
            display: block;
            height: 100%;
            cursor: grab;
        }
        #canvas.dragging { cursor: grabbing; }
        .sidebar {
            width: 360px;
            background: rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(100, 200, 255, 0.3);
            padding: 16px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .tree-section, .info-panel {
            background: rgba(20, 30, 60, 0.8);
            border: 1px solid rgba(100, 200, 255, 0.4);
            border-radius: 10px;
            padding: 12px;
        }
        .tree-header {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7ec2ff;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .tree, .tree ul {
            list-style: none;
            margin: 0;
            padding-left: 10px;
        }
        .tree > li { margin-top: 8px; }
        .tree-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #cfeaff;
            margin: 8px 0 6px 0;
            padding: 6px 8px;
            border-radius: 6px;
            background: rgba(100, 200, 255, 0.07);
            cursor: pointer;
            user-select: none;
        }
        .tree-group:hover { background: rgba(100, 200, 255, 0.12); }
        .expand-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            background: rgba(100, 200, 255, 0.18);
            color: #dfeeff;
            font-weight: bold;
            font-size: 12px;
            line-height: 1;
        }
        .tree-group.collapsed + ul { display: none; }
        .tree-item {
            display: flex; align-items: center; gap: 8px;
            width: 100%;
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            color: #dfeeff;
            border-radius: 6px;
            padding: 7px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 2px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .tree-item:hover {
            background: rgba(100, 200, 255, 0.08);
            border-color: rgba(100, 200, 255, 0.2);
        }
        .tree-item.active {
            background: linear-gradient(90deg, rgba(100, 200, 255, 0.18), rgba(255, 255, 255, 0.04));
            border-color: rgba(100, 200, 255, 0.6);
            box-shadow: 0 0 14px rgba(100, 200, 255, 0.16);
        }
        .tree-item .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .tree-item .kind {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            padding: 2px 6px;
            border-radius: 999px;
            font-size: 9px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: rgba(255,255,255,0.07);
            color: #9cc8ff;
            border: 1px solid rgba(100, 200, 255, 0.2);
        }
        .cell-name {
            font-size: 18px;
            font-weight: bold;
            color: #64c8ff;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(100, 200, 255, 0.2);
        }
        .cell-methods {
            font-size: 12px;
            color: #aaa;
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .method-item {
            padding: 6px 10px;
            background: rgba(100, 200, 255, 0.08);
            border-left: 2px solid rgba(100, 200, 255, 0.4);
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #d4e8ff;
            word-break: break-word;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .method-item:hover {
            background: rgba(100, 200, 255, 0.15);
            border-left-color: #b3ecff;
        }
        .method-item.active {
            background: rgba(255, 202, 102, 0.12);
            border-left-color: #ffd93d;
            box-shadow: 0 0 12px rgba(255, 217, 61, 0.2);
        }
        .empty-state {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 30px 10px;
        }
        .header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(100, 200, 255, 0.3);
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #64c8ff, #4a90e2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { font-size: 14px; color: #aaa; }
        .controls {
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(100, 200, 255, 0.3);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .control-item label { color: #aaa; }
        .checkbox-toggle {
            width: 40px;
            height: 20px;
            background: #444;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s;
            border: 1px solid #666;
        }
        .checkbox-toggle.active { background: #4a90e2; }
        .checkbox-toggle::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        .checkbox-toggle.active::after { left: 22px; }
        .info-legend { font-size: 11px; color: #888; }
        .legend-item { display: inline-block; margin: 0 12px 0 0; }
        .legend-color {
            display: inline-block;
            width: 12px; height: 12px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧬 Écosystème vivant : micro-entreprise-suivi</h1>
        <p>Visualisation 3D interactive du système biologique de gestion d'activité indépendant</p>
    </div>
    
    <div class="main-container">
        <canvas id="canvas"></canvas>
        
        <aside class="sidebar">
            <div class="tree-section">
                <div class="tree-header">Arborescence de l'écosystème</div>
                <ul id="treeRoot" class="tree"></ul>
            </div>
            <div class="info-panel">
                <div id="infoPanel">
                    <div class="empty-state">👁️ Sélectionnez un élément ou une méthode pour filtrer le flux</div>
                </div>
            </div>
        </aside>
    </div>
    
    <div class="controls">
        <div class="control-item"><label>Rotation auto</label><div class="checkbox-toggle active" id="autoRotate"></div></div>
        <div class="control-item"><label>Signaux lumineux</label><div class="checkbox-toggle active" id="showSignals"></div></div>
        <div class="control-item"><label>Cascade facture</label><div class="checkbox-toggle active" id="showCascade"></div></div>
        <div class="control-item"><label>Organelles respirantes</label><div class="checkbox-toggle active" id="showPulsing"></div></div>
        <div class="legend-item info-legend"><span class="legend-color" style="background: #ff6b6b;"></span>Entités métier</div>
        <div class="legend-item info-legend"><span class="legend-color" style="background: #4ecdc4;"></span>Services</div>
        <div class="legend-item info-legend"><span class="legend-color" style="background: #ffd93d;"></span>Dashboard</div>
        <div class="legend-item info-legend"><span class="legend-color" style="background: #a8e6cf;"></span>Persistance</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const publicMethods = {
            'CLIENT': ['listClients()', 'getClientById(id)', 'createClient(input)', 'updateClient(id, input)', 'deleteClient(id)'],
            'PROJET': ['listProjects()', 'getProjectById(id)', 'createProject(input)', 'updateProject(id, input)'],
            'HEURE': ['listHeures()', 'getHeureById(id)', 'createHeure(input)', 'updateHeure(id, input)', 'deleteHeure(id)'],
            'FRAIS': ['listFrais()', 'createFrais(input)', 'updateFrais(id, input)', 'deleteFrais(id)'],
            'ENCAISSEMENT': ['listEncaissements()', 'createEncaissement(input)', 'updateEncaissement(id, input)'],
            'FACTURE': ['listFactures()', 'getFactureById(id)', 'createFacture(input)', 'updateFacture(id, input)', 'deleteFacture(id)', 'createAvoir(id)', 'buildAnnualExport(year)'],
            'ISSUER\nPROFILE': ['getIssuerProfile()', 'updateIssuerProfile(input)', 'isIssuerProfileComplete()'],
            'clientService': ['listClients()', 'getClientById(id)', 'createClient(input)', 'updateClient(id)', 'softDeleteClientsForProject()'],
            'projectService': ['listProjects()', 'listAllProjects()', 'getProjectById(id)', 'createProject(input)', 'updateProject(id, input)'],
            'heuresService': ['listHeures()', 'listAllHeures()', 'createHeure(input)', 'updateHeure(id, input)', 'deleteHeure(id)'],
            'factureService': ['listFactures()', 'listAllFactures()', 'createFacture(input)', 'updateFacture(id, input)', 'deleteFacture(id)', 'createAvoir(id)', 'getChiffreAffairesAnnuel()'],
            'encaissementService': ['listEncaissements()', 'createEncaissement(input)', 'updateEncaissement(id, input)', 'deleteEncaissement(id)'],
            'fraisService': ['listFrais()', 'createFrais(input)', 'updateFrais(id, input)', 'deleteFrais(id)'],
            'issuerService': ['getIssuerProfile()', 'updateIssuerProfile(input)', 'isIssuerProfileComplete()'],
            'dashboardService': ['getDashboardStats()', 'computeMonthlyPoints()', 'computeClientShare()'],
            'CSV Repos\n(ADN)': ['writeAllClients()', 'writeAllProjects()', 'writeAllHeures()', 'writeAllFactures()', 'writeAllFrais()', 'writeAllEncaissements()']
        };

        const methodFlows = {
            'buildLines()': ['HEURE', 'FACTURE'],
            'createFacture(input)': ['factureService', 'FACTURE'],
            'updateFacture(id, input)': ['factureService', 'FACTURE', 'ENCAISSEMENT'],
            'createAvoir(id)': ['FACTURE', 'factureService'],
            'getDashboardStats()': ['dashboardService', 'FACTURE', 'ENCAISSEMENT', 'HEURE', 'PROJET'],
            'listFactures()': ['factureService', 'FACTURE'],
            'listClients()': ['clientService', 'CLIENT'],
            'listProjects()': ['projectService', 'PROJET'],
            'listHeures()': ['heuresService', 'HEURE'],
            'listFrais()': ['fraisService', 'FRAIS'],
            'listEncaissements()': ['encaissementService', 'ENCAISSEMENT'],
            'getClientById(id)': ['clientService', 'CLIENT'],
            'getProjectById(id)': ['projectService', 'PROJET'],
            'getHeureById(id)': ['heuresService', 'HEURE'],
            'createEncaissement(input)': ['encaissementService', 'ENCAISSEMENT', 'FACTURE'],
            'getIssuerProfile()': ['issuerService', 'ISSUER\nPROFILE'],
            'writeAllFactures()': ['CSV Repos\n(ADN)', 'FACTURE'],
            'writeAllClients()': ['CSV Repos\n(ADN)', 'CLIENT'],
            'writeAllProjects()': ['CSV Repos\n(ADN)', 'PROJET'],
            'writeAllHeures()': ['CSV Repos\n(ADN)', 'HEURE'],
            'writeAllFrais()': ['CSV Repos\n(ADN)', 'FRAIS'],
            'writeAllEncaissements()': ['CSV Repos\n(ADN)', 'ENCAISSEMENT']
        };

        const treeData = [
            { group: 'Entités métier', kind: 'entity', items: ['CLIENT', 'PROJET', 'HEURE', 'FRAIS', 'ENCAISSEMENT', 'FACTURE', 'ISSUER\nPROFILE'] },
            { group: 'Services', kind: 'service', items: ['clientService', 'projectService', 'heuresService', 'factureService', 'encaissementService', 'fraisService', 'issuerService'] },
            { group: 'Dashboard & ADN', kind: 'dashboard', items: ['dashboardService', 'CSV Repos\n(ADN)'] }
        ];

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 360) / (window.innerHeight - 150), 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth - 360, window.innerHeight - 150);
        renderer.setClearColor(0x0a0e27, 1);
        renderer.shadowMap.enabled = true;
        camera.position.set(0, 0, 120);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x64c8ff, 1.8, 500); pointLight.position.set(50, 100, 100); pointLight.castShadow = true; scene.add(pointLight);
        const pointLight2 = new THREE.PointLight(0x4ecdc4, 1.3, 500); pointLight2.position.set(-50, -50, 80); scene.add(pointLight2);

        const starsGeometry = new THREE.BufferGeometry();
        const starsMaterial = new THREE.PointsMaterial({ color: 0x64c8ff, size: 0.5, sizeAttenuation: true });
        const starsVertices = [];
        for (let i = 0; i < 900; i++) {
            starsVertices.push((Math.random() - 0.5) * 2000, (Math.random() - 0.5) * 2000, (Math.random() - 0.5) * 2000);
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starsVertices), 3));
        scene.add(new THREE.Points(starsGeometry, starsMaterial));

        const cells = [
            { name: 'CLIENT', pos: { x: -60, y: 40, z: 0 }, color: 0xff6b6b, type: 'entity' },
            { name: 'PROJET', pos: { x: -30, y: 40, z: -40 }, color: 0xff6b6b, type: 'entity' },
            { name: 'HEURE', pos: { x: 0, y: 40, z: -50 }, color: 0xff6b6b, type: 'entity' },
            { name: 'FRAIS', pos: { x: 30, y: 40, z: -40 }, color: 0xff6b6b, type: 'entity' },
            { name: 'ENCAISSEMENT', pos: { x: 60, y: 40, z: 0 }, color: 0xff6b6b, type: 'entity' },
            { name: 'FACTURE', pos: { x: 60, y: -30, z: 0 }, color: 0xff6b6b, type: 'entity', size: 1.5 },
            { name: 'ISSUER\nPROFILE', pos: { x: -60, y: -30, z: 0 }, color: 0xff6b6b, type: 'entity' },
            { name: 'factureService', pos: { x: 30, y: 0, z: 40 }, color: 0x4ecdc4, type: 'service' },
            { name: 'encaissementService', pos: { x: 15, y: -15, z: 50 }, color: 0x4ecdc4, type: 'service' },
            { name: 'heuresService', pos: { x: -15, y: -15, z: 50 }, color: 0x4ecdc4, type: 'service' },
            { name: 'clientService', pos: { x: -30, y: 0, z: 40 }, color: 0x4ecdc4, type: 'service' },
            { name: 'projectService', pos: { x: 0, y: 15, z: 50 }, color: 0x4ecdc4, type: 'service' },
            { name: 'fraisService', pos: { x: -45, y: -15, z: 40 }, color: 0x4ecdc4, type: 'service' },
            { name: 'issuerService', pos: { x: 45, y: -15, z: 40 }, color: 0x4ecdc4, type: 'service' },
            { name: 'dashboardService', pos: { x: 0, y: 0, z: 0 }, color: 0xffd93d, type: 'dashboard', size: 2 },
            { name: 'CSV Repos\n(ADN)', pos: { x: 0, y: -60, z: 0 }, color: 0xa8e6cf, type: 'dna', size: 1.8 }
        ];

        const meshMap = new Map();
        const cellMeshes = [];
        cells.forEach((cell) => {
            const size = cell.size || 1;
            const geometry = new THREE.IcosahedronGeometry(8 * size, 4);
            const material = new THREE.MeshPhongMaterial({
                color: cell.color,
                emissive: cell.color,
                emissiveIntensity: 0.3,
                shininess: 100,
                wireframe: false
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(cell.pos.x, cell.pos.y, cell.pos.z);
            mesh.castShadow = true; mesh.receiveShadow = true;
            mesh.userData = { ...cell };
            scene.add(mesh);
            cellMeshes.push(mesh);
            meshMap.set(cell.name, mesh);
        });

        const connectionPairs = [
            [5, 0], [5, 1], [5, 2], [5, 4],
            [0, 7], [1, 9], [2, 10], [4, 8], [6, 11], [3, 12], [6, 13],
            [7, 14], [8, 14], [9, 14], [10, 14], [12, 14], [13, 14], [11, 14],
            [14, 15]
        ];

        const lineSegments = [];
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x64c8ff, transparent: true, opacity: 0.28 });
        connectionPairs.forEach(([from, to]) => {
            const a = cellMeshes[from].position;
            const b = cellMeshes[to].position;
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array([a.x,a.y,a.z,b.x,b.y,b.z]), 3));
            const line = new THREE.Line(geometry, lineMaterial.clone());
            scene.add(line);
            lineSegments.push({ line, fromIdx: from, toIdx: to });
        });

        const cascadeSequence = [
            { from: 2, to: 5, color: 0xff9999, duration: 2 },
            { from: 5, to: 8, color: 0xff9999, duration: 1.5 },
            { from: 8, to: 4, color: 0xff9999, duration: 1.5 }
        ];
        const cascadeParticles = [];

        const particles = [];
        const particleGeometry = new THREE.SphereGeometry(1.5, 10, 10);
        connectionPairs.forEach(([from, to]) => {
            for (let i = 0; i < 2; i++) {
                const p = new THREE.Mesh(particleGeometry, new THREE.MeshBasicMaterial({ color: 0x64c8ff, emissive: 0x64c8ff }));
                p.userData = { from, to, progress: Math.random(), delay: Math.random() * 2 };
                scene.add(p);
                particles.push(p);
            }
        });

        const treeRoot = document.getElementById('treeRoot');
        const infoPanel = document.getElementById('infoPanel');

        let selectedCellName = 'FACTURE';
        let selectedMethodName = null;
        let activeFlow = null;
        let collapsedGroups = new Set();

        function getDisplayName(name) { return name.replace(/\n/g, ' '); }
        function getCellColor(name) { const mesh = meshMap.get(name); return '#' + (mesh ? mesh.material.color.getHexString() : '9aa6b2'); }
        function getKindLabel(name) {
            if (['CLIENT','PROJET','HEURE','FRAIS','ENCAISSEMENT','FACTURE','ISSUER\nPROFILE'].includes(name)) return 'Entité';
            if (['clientService','projectService','heuresService','factureService','encaissementService','fraisService','issuerService'].includes(name)) return 'Service';
            if (['dashboardService'].includes(name)) return 'Dashboard';
            if (['CSV Repos\n(ADN)'].includes(name)) return 'ADN';
            return 'Bloc';
        }

        function updateSelectionVisuals() {
            const relevant = new Set(activeFlow || []);
            if (selectedCellName) relevant.add(selectedCellName);
            const dimmed = selectedCellName || selectedMethodName ? true : false;

            cellMeshes.forEach((mesh) => {
                const name = mesh.userData.name;
                const isSelected = name === selectedCellName;
                const inFlow = activeFlow ? activeFlow.includes(name) : true;
                const dimmedNode = dimmed && !isSelected && !inFlow;
                const base = 0.3;
                mesh.material.emissiveIntensity = isSelected ? 1.15 : (inFlow ? 0.55 : 0.08);
                mesh.material.opacity = dimmedNode ? 0.2 : 1;
                mesh.scale.set(isSelected ? 1.35 : inFlow ? 1.08 : 0.9, isSelected ? 1.35 : inFlow ? 1.08 : 0.9, isSelected ? 1.35 : inFlow ? 1.08 : 0.9);
                mesh.visible = !dimmedNode;
            });

            lineSegments.forEach((segment) => {
                const fromName = cellMeshes[segment.fromIdx].userData.name;
                const toName = cellMeshes[segment.toIdx].userData.name;
                const shouldHighlight = !activeFlow || (activeFlow.includes(fromName) && activeFlow.includes(toName));
                segment.line.material.opacity = activeFlow ? (shouldHighlight ? 0.9 : 0.03) : 0.28;
                segment.line.material.color.setHex(activeFlow ? 0x8be9fd : 0x64c8ff);
            });
        }

        function setActiveMethod(methodName) {
            selectedMethodName = methodName;
            activeFlow = methodFlows[methodName] || null;
            updateSelectionVisuals();
            renderMethodInfo(selectedCellName, methodName);
            document.querySelectorAll('.method-item').forEach((el) => {
                el.classList.toggle('active', el.dataset.method === methodName);
            });
            if (activeFlow && activeFlow.length) {
                const list = Array.from(new Set(activeFlow));
                list.forEach((key) => {
                    const btn = document.querySelector(`.tree-item[data-key="${key}"]`);
                    if (btn) btn.classList.add('active');
                });
            }
        }

        function setSelectedCell(name, fromList = false) {
            selectedCellName = name;
            if (!selectedMethodName) {
                activeFlow = null;
                renderMethodInfo(name, null);
            } else {
                renderMethodInfo(name, selectedMethodName);
            }
            updateSelectionVisuals();
            updateTreeSelection();
            if (fromList) {
                const btn = document.querySelector(`.tree-item[data-key="${name}"]`);
                if (btn) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function renderMethodInfo(name, methodName) {
            if (!name) {
                infoPanel.innerHTML = '<div class="empty-state">Aucune cellule sélectionnée.</div>';
                return;
            }
            const methods = publicMethods[name] || [];
            if (!methods.length) {
                infoPanel.innerHTML = '<div class="empty-state">Pas de méthode publique pour cet élément.</div>';
                return;
            }
            infoPanel.innerHTML = `
                <div class="cell-name">${getDisplayName(name)}</div>
                <div class="cell-methods">
                    ${methods.map((method) => `<div class="method-item ${methodName === method ? 'active' : ''}" data-method="${method}">${method}</div>`).join('')}
                </div>
            `;
            infoPanel.querySelectorAll('.method-item').forEach((item) => {
                item.addEventListener('click', () => {
                    setActiveMethod(item.dataset.method);
                });
            });
        }

        function updateTreeSelection() {
            document.querySelectorAll('.tree-item').forEach((btn) => {
                const isActive = btn.dataset.key === selectedCellName || (activeFlow && activeFlow.includes(btn.dataset.key));
                btn.classList.toggle('active', isActive);
            });
        }

        function renderTree() {
            treeRoot.innerHTML = '';
            treeData.forEach((group) => {
                const li = document.createElement('li');
                const header = document.createElement('div');
                header.className = 'tree-group' + (collapsedGroups.has(group.group) ? ' collapsed' : '');
                header.innerHTML = `<span class="expand-toggle">${collapsedGroups.has(group.group) ? '+' : '−'}</span><span>${group.group}</span>`;
                header.addEventListener('click', () => {
                    if (collapsedGroups.has(group.group)) collapsedGroups.delete(group.group);
                    else collapsedGroups.add(group.group);
                    renderTree();
                });
                li.appendChild(header);

                const ul = document.createElement('ul');
                group.items.forEach((name) => {
                    const item = document.createElement('li');
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'tree-item';
                    button.dataset.key = name;
                    button.innerHTML = `
                        <span class="dot" style="background:${getCellColor(name)}"></span>
                        <span class="kind">${getKindLabel(name)}</span>
                        <span>${getDisplayName(name)}</span>
                    `;
                    button.addEventListener('click', () => setSelectedCell(name, true));
                    item.appendChild(button);
                    ul.appendChild(item);
                });
                li.appendChild(ul);
                treeRoot.appendChild(li);
            });
            updateTreeSelection();
        }

        renderTree();
        setSelectedCell('FACTURE');

        const canvas = document.getElementById('canvas');
        let isDragging = false;
        let lastPointerX = 0; let lastPointerY = 0;

        canvas.addEventListener('pointerdown', (event) => {
            isDragging = true; canvas.classList.add('dragging');
            lastPointerX = event.clientX; lastPointerY = event.clientY;
            canvas.setPointerCapture(event.pointerId);
        });

        canvas.addEventListener('pointermove', (event) => {
            if (!isDragging) return;
            const dx = event.clientX - lastPointerX;
            const dy = event.clientY - lastPointerY;
            lastPointerX = event.clientX; lastPointerY = event.clientY;
            scene.rotation.y += dx * 0.01;
            scene.rotation.x += dy * 0.01;
            if (scene.rotation.x > 1.2) scene.rotation.x = 1.2;
            if (scene.rotation.x < -1.2) scene.rotation.x = -1.2;
        });

        const stopDragging = () => { isDragging = false; canvas.classList.remove('dragging'); };
        canvas.addEventListener('pointerup', stopDragging);
        canvas.addEventListener('pointerleave', stopDragging);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        canvas.addEventListener('click', (event) => {
            if (isDragging) return;
            const rect = canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersections = raycaster.intersectObjects(cellMeshes);
            if (intersections.length > 0) {
                const picked = intersections[0].object.userData.name;
                setSelectedCell(picked, false);
            }
        });

        canvas.addEventListener('mousemove', (event) => {
            if (isDragging) return;
            const rect = canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersections = raycaster.intersectObjects(cellMeshes);
            if (intersections.length > 0) {
                const name = intersections[0].object.userData.name;
                const methods = publicMethods[name] || [];
                if (methods.length) {
                    renderMethodInfo(name, selectedMethodName);
                }
            }
        });

        let autoRotate = true;
        let showSignals = true;
        let showCascade = true;
        let showPulsing = true;
        let cascadeTimer = 0;

        document.getElementById('autoRotate').addEventListener('click', function() { this.classList.toggle('active'); autoRotate = this.classList.contains('active'); });
        document.getElementById('showSignals').addEventListener('click', function() { this.classList.toggle('active'); showSignals = this.classList.contains('active'); });
        document.getElementById('showCascade').addEventListener('click', function() { this.classList.toggle('active'); showCascade = this.classList.contains('active'); });
        document.getElementById('showPulsing').addEventListener('click', function() { this.classList.toggle('active'); showPulsing = this.classList.contains('active'); });

        window.addEventListener('resize', () => {
            camera.aspect = (window.innerWidth - 360) / (window.innerHeight - 150);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 360, window.innerHeight - 150);
        });

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            cascadeTimer += 0.01;
            if (cascadeTimer > 8) cascadeTimer = 0;

            if (autoRotate && !isDragging) {
                scene.rotation.y += 0.0006;
                scene.rotation.x += 0.0002;
            }

            if (showPulsing) {
                cellMeshes.forEach((mesh) => {
                    const pulse = 1 + Math.sin(time * 2 + mesh.position.x) * 0.12;
                    const name = mesh.userData.name;
                    const inFlow = activeFlow ? activeFlow.includes(name) : true;
                    const isSelected = name === selectedCellName;
                    if (mesh.userData.type === 'dashboard') {
                        mesh.scale.set(pulse * 1.5, pulse * 1.5, pulse * 1.5);
                    } else if (mesh.userData.type === 'dna') {
                        mesh.scale.set(pulse * 1.2, pulse * 1.2, pulse * 1.2);
                    } else if (isSelected || inFlow) {
                        mesh.scale.set(pulse * (isSelected ? 1.35 : 1.08), pulse * (isSelected ? 1.35 : 1.08), pulse * (isSelected ? 1.35 : 1.08));
                    } else {
                        mesh.scale.set(0.9, 0.9, 0.9);
                    }
                });
            }

            if (showCascade) {
                cascadeSequence.forEach((step, stepIdx) => {
                    const phase = cascadeTimer - stepIdx * 2.5;
                    if (phase >= 0 && phase <= step.duration) {
                        const progress = phase / step.duration;
                        const from = cellMeshes[step.from];
                        const to = cellMeshes[step.to];
                        let particle = cascadeParticles[stepIdx];
                        if (!particle) {
                            const geom = new THREE.SphereGeometry(2.4, 14, 14);
                            const mat = new THREE.MeshBasicMaterial({ color: step.color, emissive: step.color });
                            particle = new THREE.Mesh(geom, mat);
                            scene.add(particle);
                            cascadeParticles[stepIdx] = particle;
                        }
                        particle.visible = true;
                        particle.position.lerpVectors(from.position, to.position, progress);
                        particle.scale.set(0.8 + Math.sin(progress * Math.PI) * 0.4, 0.8 + Math.sin(progress * Math.PI) * 0.4, 0.8 + Math.sin(progress * Math.PI) * 0.4);
                        from.material.emissiveIntensity = 0.8;
                        to.material.emissiveIntensity = 0.8;
                    } else if (cascadeParticles[stepIdx]) {
                        cascadeParticles[stepIdx].visible = false;
                    }
                });
            }

            if (showSignals) {
                particles.forEach((p) => {
                    p.userData.progress += 0.006;
                    if (p.userData.progress > 1) p.userData.progress = 0;
                    const from = cellMeshes[p.userData.from];
                    const to = cellMeshes[p.userData.to];
                    const progress = (p.userData.progress + p.userData.delay) % 1;
                    p.position.lerpVectors(from.position, to.position, progress);
                    p.scale.set(1 + Math.sin(time * 4) * 0.3, 1 + Math.sin(time * 4) * 0.3, 1 + Math.sin(time * 4) * 0.3);
                    p.visible = true;
                });
            } else {
                particles.forEach((p) => p.visible = false);
            }

            lineSegments.forEach((seg, i) => {
                const fromName = cellMeshes[seg.fromIdx].userData.name;
                const toName = cellMeshes[seg.toIdx].userData.name;
                const visibleFlow = !activeFlow || (activeFlow.includes(fromName) && activeFlow.includes(toName));
                seg.line.material.opacity = visibleFlow ? (activeFlow ? 0.9 : 0.28 + Math.sin(time + i * 0.8) * 0.12) : 0.04;
                seg.line.material.color.setHex(activeFlow ? (visibleFlow ? 0x8be9fd : 0x4a5a72) : 0x64c8ff);
            });

            cellMeshes.forEach((mesh) => {
                const name = mesh.userData.name;
                const isSelected = name === selectedCellName;
                const inFlow = !activeFlow || activeFlow.includes(name);
                mesh.material.emissiveIntensity = isSelected ? 1.15 : (activeFlow ? (inFlow ? 0.55 : 0.08) : 0.3);
                mesh.visible = !activeFlow || inFlow || isSelected;
            });

            renderer.render(scene, camera);
        }

        updateSelectionVisuals();
        animate();
    </script>
</body>
</html>
