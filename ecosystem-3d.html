<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 Écosystème 3D - micro-entreprise-suivi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
            overflow: hidden;
        }
        #canvas {
            width: 100%;
            height: calc(100vh - 200px);
            display: block;
        }
        .header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(100, 200, 255, 0.3);
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #64c8ff, #4a90e2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            font-size: 14px;
            color: #aaa;
        }
        .controls {
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(100, 200, 255, 0.3);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .control-item label {
            color: #aaa;
        }
        .checkbox-toggle {
            width: 40px;
            height: 20px;
            background: #444;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s;
            border: 1px solid #666;
        }
        .checkbox-toggle.active {
            background: #4a90e2;
        }
        .checkbox-toggle::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        .checkbox-toggle.active::after {
            left: 22px;
        }
        .info-legend {
            font-size: 11px;
            color: #888;
        }
        .legend-item {
            display: inline-block;
            margin: 0 12px 0 0;
        }
        .legend-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }
        .info-panel {
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(100, 200, 255, 0.3);
            font-size: 12px;
            color: #aaa;
            max-height: 40px;
            overflow-y: auto;
        }
        .cell-info {
            display: inline-block;
            margin-right: 30px;
        }
        .cell-name {
            color: #64c8ff;
            font-weight: bold;
        }
        .cell-methods {
            color: #888;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧬 Écosystème vivant : micro-entreprise-suivi</h1>
        <p>Visualisation 3D interactive du système biologique de gestion d'activité indépendant</p>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <div class="control-item">
            <label>Rotation auto</label>
            <div class="checkbox-toggle active" id="autoRotate"></div>
        </div>
        <div class="control-item">
            <label>Signaux lumineux</label>
            <div class="checkbox-toggle active" id="showSignals"></div>
        </div>
        <div class="control-item">
            <label>Cascade facture</label>
            <div class="checkbox-toggle active" id="showCascade"></div>
        </div>
        <div class="control-item">
            <label>Organelles respirantes</label>
            <div class="checkbox-toggle active" id="showPulsing"></div>
        </div>
        
        <div class="legend-item info-legend">
            <span class="legend-color" style="background: #ff6b6b;"></span> Entités métier
        </div>
        <div class="legend-item info-legend">
            <span class="legend-color" style="background: #4ecdc4;"></span> Services
        </div>
        <div class="legend-item info-legend">
            <span class="legend-color" style="background: #ffd93d;"></span> Dashboard
        </div>
        <div class="legend-item info-legend">
            <span class="legend-color" style="background: #a8e6cf;"></span> Persistance
        </div>
    </div>

    <div class="info-panel" id="infoPanel"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Public methods for each entity/service
        const publicMethods = {
            'CLIENT': ['listClients()', 'getClientById(id)', 'createClient(input)', 'updateClient(id, input)', 'deleteClient(id)'],
            'PROJET': ['listProjects()', 'getProjectById(id)', 'createProject(input)', 'updateProject(id, input)'],
            'HEURE': ['listHeures()', 'getHeureById(id)', 'createHeure(input)', 'updateHeure(id, input)', 'deleteHeure(id)'],
            'FRAIS': ['listFrais()', 'createFrais(input)', 'updateFrais(id, input)', 'deleteFrais(id)'],
            'ENCAISSEMENT': ['listEncaissements()', 'createEncaissement(input)', 'updateEncaissement(id, input)'],
            'FACTURE': ['listFactures()', 'getFactureById(id)', 'createFacture(input)', 'updateFacture(id, input)', 'deleteFacture(id)', 'createAvoir(id)', 'buildAnnualExport(year)'],
            'ISSUER\nPROFILE': ['getIssuerProfile()', 'updateIssuerProfile(input)', 'isIssuerProfileComplete()'],
            'clientService': ['listClients()', 'getClientById(id)', 'createClient(input)', 'updateClient(id)', 'softDeleteClientsForProject()'],
            'projectService': ['listProjects()', 'listAllProjects()', 'getProjectById(id)', 'createProject(input)', 'updateProject(id, input)'],
            'heuresService': ['listHeures()', 'listAllHeures()', 'createHeure(input)', 'updateHeure(id, input)', 'deleteHeure(id)'],
            'factureService': ['listFactures()', 'listAllFactures()', 'createFacture(input)', 'updateFacture(id, input)', 'deleteFacture(id)', 'createAvoir(id)', 'getChiffreAffairesAnnuel()'],
            'encaissementService': ['listEncaissements()', 'createEncaissement(input)', 'updateEncaissement(id, input)', 'deleteEncaissement(id)'],
            'fraisService': ['listFrais()', 'createFrais(input)', 'updateFrais(id, input)', 'deleteFrais(id)'],
            'issuerService': ['getIssuerProfile()', 'updateIssuerProfile(input)', 'isIssuerProfileComplete()'],
            'dashboardService': ['getDashboardStats()', 'computeMonthlyPoints()', 'computeClientShare()'],
            'CSV Repos\n(ADN)': ['writeAllClients()', 'writeAllProjects()', 'writeAllHeures()', 'writeAllFactures()', 'writeAllFrais()', 'writeAllEncaissements()']
        };

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerHeight - 200), 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight - 200);
        renderer.setClearColor(0x0a0e27, 1);
        renderer.shadowMap.enabled = true;
        
        camera.position.set(0, 0, 120);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0x64c8ff, 2, 500);
        pointLight.position.set(50, 100, 100);
        pointLight.castShadow = true;
        scene.add(pointLight);
        
        const pointLight2 = new THREE.PointLight(0x4ecdc4, 1.5, 500);
        pointLight2.position.set(-50, -50, 80);
        scene.add(pointLight2);
        
        // Background stars
        const starsGeometry = new THREE.BufferGeometry();
        const starsMaterial = new THREE.PointsMaterial({ color: 0x64c8ff, size: 0.5, sizeAttenuation: true });
        const starsVertices = [];
        for (let i = 0; i < 1000; i++) {
            const x = (Math.random() - 0.5) * 2000;
            const y = (Math.random() - 0.5) * 2000;
            const z = (Math.random() - 0.5) * 2000;
            starsVertices.push(x, y, z);
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starsVertices), 3));
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);
        
        // Cells data
        const cells = [
            { name: 'CLIENT', pos: { x: -60, y: 40, z: 0 }, color: 0xff6b6b, type: 'entity' },
            { name: 'PROJET', pos: { x: -30, y: 40, z: -40 }, color: 0xff6b6b, type: 'entity' },
            { name: 'HEURE', pos: { x: 0, y: 40, z: -50 }, color: 0xff6b6b, type: 'entity' },
            { name: 'FRAIS', pos: { x: 30, y: 40, z: -40 }, color: 0xff6b6b, type: 'entity' },
            { name: 'ENCAISSEMENT', pos: { x: 60, y: 40, z: 0 }, color: 0xff6b6b, type: 'entity' },
            
            { name: 'FACTURE', pos: { x: 60, y: -30, z: 0 }, color: 0xff6b6b, type: 'entity', size: 1.5 },
            { name: 'ISSUER\nPROFILE', pos: { x: -60, y: -30, z: 0 }, color: 0xff6b6b, type: 'entity' },
            
            { name: 'factureService', pos: { x: 30, y: 0, z: 40 }, color: 0x4ecdc4, type: 'service' },
            { name: 'encaissementService', pos: { x: 15, y: -15, z: 50 }, color: 0x4ecdc4, type: 'service' },
            { name: 'heuresService', pos: { x: -15, y: -15, z: 50 }, color: 0x4ecdc4, type: 'service' },
            { name: 'clientService', pos: { x: -30, y: 0, z: 40 }, color: 0x4ecdc4, type: 'service' },
            { name: 'projectService', pos: { x: 0, y: 15, z: 50 }, color: 0x4ecdc4, type: 'service' },
            { name: 'fraisService', pos: { x: -45, y: -15, z: 40 }, color: 0x4ecdc4, type: 'service' },
            { name: 'issuerService', pos: { x: 45, y: -15, z: 40 }, color: 0x4ecdc4, type: 'service' },
            
            { name: 'dashboardService', pos: { x: 0, y: 0, z: 0 }, color: 0xffd93d, type: 'dashboard', size: 2 },
            
            { name: 'CSV Repos\n(ADN)', pos: { x: 0, y: -60, z: 0 }, color: 0xa8e6cf, type: 'dna', size: 1.8 }
        ];
        
        // Create cell meshes
        const cellMeshes = [];
        
        cells.forEach((cell, idx) => {
            const size = cell.size || 1;
            const geometry = new THREE.IcosahedronGeometry(8 * size, 4);
            const material = new THREE.MeshPhongMaterial({
                color: cell.color,
                emissive: cell.color,
                emissiveIntensity: 0.3,
                shininess: 100,
                wireframe: false
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(cell.pos.x, cell.pos.y, cell.pos.z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { ...cell, originalSize: size, idx };
            scene.add(mesh);
            cellMeshes.push(mesh);
        });
        
        // Connection lines (pores cellulaires)
        const connections = [
            [5, 0], [5, 1], [5, 2], [5, 4],  // Facture connects
            [0, 7], [1, 9], [2, 10], [4, 8], [6, 11], [3, 12], [6, 13],  // Services connect
            [7, 14], [8, 14], [9, 14], [10, 14], [12, 14], [13, 14], [11, 14], // All to dashboard
            [14, 15] // Dashboard to DNA
        ];
        
        const linesMaterial = new THREE.LineBasicMaterial({ color: 0x64c8ff, linewidth: 2, transparent: true, opacity: 0.3 });
        const lineSegments = [];
        
        connections.forEach(([from, to]) => {
            const fromPos = cellMeshes[from].position;
            const toPos = cellMeshes[to].position;
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(
                new Float32Array([fromPos.x, fromPos.y, fromPos.z, toPos.x, toPos.y, toPos.z]),
                3
            ));
            const line = new THREE.Line(geometry, linesMaterial);
            scene.add(line);
            lineSegments.push({ line, fromIdx: from, toIdx: to });
        });
        
        // Cascade animation - HEURE -> FACTURE -> ENCAISSEMENT
        const cascadeSequence = [
            { from: 2, to: 5, label: 'buildLines()', color: 0xff9999, duration: 2 },  // HEURE -> FACTURE
            { from: 5, to: 8, label: 'updateFacture()', color: 0xff9999, duration: 1.5 },  // FACTURE -> encaissementService
            { from: 8, to: 4, label: 'createEncaissement()', color: 0xff9999, duration: 1.5 }  // ENCAISSEMENT
        ];
        
        const cascadeParticles = [];
        
        // Signal particles (neurotransmitters)
        const particles = [];
        const particleGeometry = new THREE.SphereGeometry(1.5, 8, 8);
        
        connections.forEach(([from, to], idx) => {
            for (let i = 0; i < 2; i++) {
                const particle = new THREE.Mesh(particleGeometry, new THREE.MeshBasicMaterial({ color: 0x64c8ff, emissive: 0x64c8ff }));
                particle.userData = { from, to, progress: Math.random(), delay: Math.random() * 2, isCascade: false };
                scene.add(particle);
                particles.push(particle);
            }
        });
        
        // Controls
        let autoRotate = true;
        let showSignals = true;
        let showCascade = true;
        let showPulsing = true;
        let cascadeTimer = 0;
        
        document.getElementById('autoRotate').addEventListener('click', function() {
            this.classList.toggle('active');
            autoRotate = this.classList.contains('active');
        });
        
        document.getElementById('showSignals').addEventListener('click', function() {
            this.classList.toggle('active');
            showSignals = this.classList.contains('active');
        });
        
        document.getElementById('showCascade').addEventListener('click', function() {
            this.classList.toggle('active');
            showCascade = this.classList.contains('active');
        });
        
        document.getElementById('showPulsing').addEventListener('click', function() {
            this.classList.toggle('active');
            showPulsing = this.classList.contains('active');
        });
        
        // Mouse interaction - Display methods on hover
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredCell = null;
        const infoPanel = document.getElementById('infoPanel');
        
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -((e.clientY - 200) / (window.innerHeight - 200)) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cellMeshes);
            
            cellMeshes.forEach(cell => {
                cell.material.emissiveIntensity = 0.3;
                cell.scale.set(1, 1, 1);
            });
            
            infoPanel.innerHTML = '';
            
            if (intersects.length > 0) {
                hoveredCell = intersects[0].object;
                hoveredCell.material.emissiveIntensity = 0.8;
                hoveredCell.scale.set(1.15, 1.15, 1.15);
                
                const cellName = hoveredCell.userData.name;
                const methods = publicMethods[cellName] || [];
                
                if (methods.length > 0) {
                    let html = `<div class="cell-info">
                        <span class="cell-name">${cellName}</span>
                        <div class="cell-methods">
                            ${methods.join(' • ')}
                        </div>
                    </div>`;
                    infoPanel.innerHTML = html;
                }
            } else {
                hoveredCell = null;
            }
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight - 200);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 200);
        });
        
        // Animation loop
        let time = 0;
        const animate = () => {
            requestAnimationFrame(animate);
            time += 0.01;
            cascadeTimer += 0.01;
            
            // Reset cascade every 8 seconds
            if (cascadeTimer > 8) {
                cascadeTimer = 0;
            }
            
            // Auto rotate
            if (autoRotate) {
                scene.rotation.y += 0.0003;
                scene.rotation.x += 0.0001;
            }
            
            // Pulsing effect
            if (showPulsing) {
                cellMeshes.forEach(cell => {
                    const pulse = 1 + Math.sin(time * 2 + cell.position.x) * 0.1;
                    if (cell.userData.type === 'dashboard') {
                        cell.scale.set(pulse * 1.5, pulse * 1.5, pulse * 1.5);
                    } else if (cell.userData.type === 'dna') {
                        cell.scale.set(pulse * 1.2, pulse * 1.2, pulse * 1.2);
                    } else {
                        cell.scale.set(pulse, pulse, pulse);
                    }
                });
            }
            
            // Spinning cells
            cellMeshes.forEach(cell => {
                cell.rotation.x += 0.005;
                cell.rotation.y += 0.007;
            });
            
            // Cascade animation
            if (showCascade) {
                cascadeSequence.forEach((step, stepIdx) => {
                    const stepStart = stepIdx * 2.5;
                    const relativeTime = cascadeTimer - stepStart;
                    
                    if (relativeTime >= 0 && relativeTime <= step.duration) {
                        const progress = relativeTime / step.duration;
                        const from = cellMeshes[step.from];
                        const to = cellMeshes[step.to];
                        
                        // Create cascade particle if needed
                        let cascadeParticle = cascadeParticles[stepIdx];
                        if (!cascadeParticle) {
                            const geom = new THREE.SphereGeometry(2.5, 16, 16);
                            const mat = new THREE.MeshBasicMaterial({ color: step.color, emissive: step.color });
                            cascadeParticle = new THREE.Mesh(geom, mat);
                            scene.add(cascadeParticle);
                            cascadeParticles[stepIdx] = cascadeParticle;
                        }
                        
                        cascadeParticle.position.lerpVectors(from.position, to.position, progress);
                        cascadeParticle.scale.set(
                            0.8 + Math.sin(progress * Math.PI) * 0.4,
                            0.8 + Math.sin(progress * Math.PI) * 0.4,
                            0.8 + Math.sin(progress * Math.PI) * 0.4
                        );
                        cascadeParticle.visible = true;
                        
                        // Highlight cells in cascade
                        from.material.emissiveIntensity = 0.7;
                        to.material.emissiveIntensity = 0.7;
                    } else if (cascadeParticles[stepIdx]) {
                        cascadeParticles[stepIdx].visible = false;
                    }
                });
            }
            
            // Regular signal particles
            particles.forEach(p => {
                if (showSignals) {
                    p.userData.progress += 0.005;
                    if (p.userData.progress > 1) {
                        p.userData.progress = 0;
                    }
                    
                    const from = cellMeshes[p.userData.from];
                    const to = cellMeshes[p.userData.to];
                    const progress = (p.userData.progress + p.userData.delay) % 1;
                    
                    p.position.lerpVectors(from.position, to.position, progress);
                    p.scale.set(
                        1 + Math.sin(time * 3) * 0.3,
                        1 + Math.sin(time * 3) * 0.3,
                        1 + Math.sin(time * 3) * 0.3
                    );
                    p.visible = true;
                } else {
                    p.visible = false;
                }
            });
            
            // Update line opacity
            lineSegments.forEach((seg, i) => {
                const opacity = 0.2 + 0.3 * Math.sin(time + i * 0.5);
                seg.line.material.opacity = opacity;
            });
            
            renderer.render(scene, camera);
        };
        
        animate();
    </script>
</body>
</html>
