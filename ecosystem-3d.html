<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 Écosystème 3D - micro-entreprise-suivi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
            overflow: hidden;
        }
        #canvas {
            width: 100%;
            height: calc(100vh - 150px);
            display: block;
        }
        .header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(100, 200, 255, 0.3);
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #64c8ff, #4a90e2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            font-size: 14px;
            color: #aaa;
        }
        .controls {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(100, 200, 255, 0.3);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .control-item label {
            color: #aaa;
        }
        .checkbox-toggle {
            width: 40px;
            height: 20px;
            background: #444;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s;
            border: 1px solid #666;
        }
        .checkbox-toggle.active {
            background: #4a90e2;
        }
        .checkbox-toggle::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        .checkbox-toggle.active::after {
            left: 22px;
        }
        .info-legend {
            font-size: 11px;
            color: #888;
        }
        .legend-item {
            display: inline-block;
            margin: 0 15px 0 0;
        }
        .legend-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧬 Écosystème vivant : micro-entreprise-suivi</h1>
        <p>Visualisation 3D interactive du système biologique de gestion d'activité indépendant</p>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <div class="control-item">
            <label>Rotation auto</label>
            <div class="checkbox-toggle active" id="autoRotate"></div>
        </div>
        <div class="control-item">
            <label>Signaux lumineux</label>
            <div class="checkbox-toggle active" id="showSignals"></div>
        </div>
        <div class="control-item">
            <label>Étiquettes</label>
            <div class="checkbox-toggle active" id="showLabels"></div>
        </div>
        <div class="control-item">
            <label>Organelles respirantes</label>
            <div class="checkbox-toggle active" id="showPulsing"></div>
        </div>
        
        <div class="legend-item info-legend">
            <span class="legend-color" style="background: #ff6b6b;"></span> Entités métier
        </div>
        <div class="legend-item info-legend">
            <span class="legend-color" style="background: #4ecdc4;"></span> Services (métabolisme)
        </div>
        <div class="legend-item info-legend">
            <span class="legend-color" style="background: #ffd93d;"></span> Dashboard (cœur)
        </div>
        <div class="legend-item info-legend">
            <span class="legend-color" style="background: #a8e6cf;"></span> Persistance (ADN)
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerHeight - 150), 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight - 150);
        renderer.setClearColor(0x0a0e27, 1);
        renderer.shadowMap.enabled = true;
        
        camera.position.set(0, 0, 120);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0x64c8ff, 2, 500);
        pointLight.position.set(50, 100, 100);
        pointLight.castShadow = true;
        scene.add(pointLight);
        
        const pointLight2 = new THREE.PointLight(0x4ecdc4, 1.5, 500);
        pointLight2.position.set(-50, -50, 80);
        scene.add(pointLight2);
        
        // Background stars
        const starsGeometry = new THREE.BufferGeometry();
        const starsMaterial = new THREE.PointsMaterial({ color: 0x64c8ff, size: 0.5, sizeAttenuation: true });
        const starsVertices = [];
        for (let i = 0; i < 1000; i++) {
            const x = (Math.random() - 0.5) * 2000;
            const y = (Math.random() - 0.5) * 2000;
            const z = (Math.random() - 0.5) * 2000;
            starsVertices.push(x, y, z);
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starsVertices), 3));
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);
        
        // Cells data
        const cells = [
            { name: 'CLIENT', pos: { x: -60, y: 40, z: 0 }, color: 0xff6b6b, type: 'entity' },
            { name: 'PROJET', pos: { x: -30, y: 40, z: -40 }, color: 0xff6b6b, type: 'entity' },
            { name: 'HEURE', pos: { x: 0, y: 40, z: -50 }, color: 0xff6b6b, type: 'entity' },
            { name: 'FRAIS', pos: { x: 30, y: 40, z: -40 }, color: 0xff6b6b, type: 'entity' },
            { name: 'ENCAISSEMENT', pos: { x: 60, y: 40, z: 0 }, color: 0xff6b6b, type: 'entity' },
            
            { name: 'FACTURE\n⭐⭐⭐', pos: { x: 60, y: -30, z: 0 }, color: 0xff6b6b, type: 'entity', size: 1.5 },
            { name: 'ISSUER\nPROFILE', pos: { x: -60, y: -30, z: 0 }, color: 0xff6b6b, type: 'entity' },
            
            { name: 'factureService', pos: { x: 30, y: 0, z: 40 }, color: 0x4ecdc4, type: 'service' },
            { name: 'encaissementService', pos: { x: 15, y: -15, z: 50 }, color: 0x4ecdc4, type: 'service' },
            { name: 'heuresService', pos: { x: -15, y: -15, z: 50 }, color: 0x4ecdc4, type: 'service' },
            { name: 'clientService', pos: { x: -30, y: 0, z: 40 }, color: 0x4ecdc4, type: 'service' },
            { name: 'projectService', pos: { x: 0, y: 15, z: 50 }, color: 0x4ecdc4, type: 'service' },
            { name: 'fraisService', pos: { x: -45, y: -15, z: 40 }, color: 0x4ecdc4, type: 'service' },
            { name: 'issuerService', pos: { x: 45, y: -15, z: 40 }, color: 0x4ecdc4, type: 'service' },
            
            { name: 'dashboardService\n(CŒUR)', pos: { x: 0, y: 0, z: 0 }, color: 0xffd93d, type: 'dashboard', size: 2 },
            
            { name: 'CSV Repos\n(ADN)', pos: { x: 0, y: -60, z: 0 }, color: 0xa8e6cf, type: 'dna', size: 1.8 }
        ];
        
        // Create cell meshes
        const cellMeshes = [];
        const cellLabels = [];
        
        cells.forEach(cell => {
            const size = cell.size || 1;
            const geometry = new THREE.IcosahedronGeometry(8 * size, 4);
            const material = new THREE.MeshPhongMaterial({
                color: cell.color,
                emissive: cell.color,
                emissiveIntensity: 0.3,
                shininess: 100,
                wireframe: false
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(cell.pos.x, cell.pos.y, cell.pos.z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { ...cell, originalSize: size };
            scene.add(mesh);
            cellMeshes.push(mesh);
            
            // Labels
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            const lines = cell.name.split('\n');
            lines.forEach((line, i) => {
                ctx.fillText(line, 128, 100 + i * 40);
            });
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, sizeAttenuation: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(30, 30, 1);
            sprite.position.copy(mesh.position);
            sprite.position.z += 20;
            scene.add(sprite);
            cellLabels.push(sprite);
        });
        
        // Connection lines (pores cellulaires)
        const connections = [
            [5, 0], [5, 1], [5, 2], [5, 4],  // Facture connects
            [0, 7], [1, 9], [2, 10], [4, 8], [6, 11], [3, 12], [6, 13],  // Services connect
            [7, 14], [8, 14], [9, 14], [10, 14], [12, 14], [13, 14], [11, 14], // All to dashboard
            [14, 15] // Dashboard to DNA
        ];
        
        const linesMaterial = new THREE.LineBasicMaterial({ color: 0x64c8ff, linewidth: 2, transparent: true, opacity: 0.3 });
        const lineSegments = [];
        
        connections.forEach(([from, to]) => {
            const fromPos = cellMeshes[from].position;
            const toPos = cellMeshes[to].position;
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(
                new Float32Array([fromPos.x, fromPos.y, fromPos.z, toPos.x, toPos.y, toPos.z]),
                3
            ));
            const line = new THREE.Line(geometry, linesMaterial);
            scene.add(line);
            lineSegments.push({ line, fromIdx: from, toIdx: to });
        });
        
        // Signal particles
        const particles = [];
        const particleGeometry = new THREE.SphereGeometry(1.5, 8, 8);
        const particleMaterial = new THREE.MeshBasicMaterial({ color: 0x64c8ff, emissive: 0x64c8ff });
        
        connections.forEach(([from, to]) => {
            for (let i = 0; i < 3; i++) {
                const particle = new THREE.Mesh(particleGeometry, particleMaterial.clone());
                particle.userData = { from, to, progress: Math.random(), delay: Math.random() * 2 };
                scene.add(particle);
                particles.push(particle);
            }
        });
        
        // Controls
        let autoRotate = true;
        let showSignals = true;
        let showLabels = true;
        let showPulsing = true;
        
        document.getElementById('autoRotate').addEventListener('click', function() {
            this.classList.toggle('active');
            autoRotate = this.classList.contains('active');
        });
        
        document.getElementById('showSignals').addEventListener('click', function() {
            this.classList.toggle('active');
            showSignals = this.classList.contains('active');
            particles.forEach(p => p.visible = showSignals);
        });
        
        document.getElementById('showLabels').addEventListener('click', function() {
            this.classList.toggle('active');
            showLabels = this.classList.contains('active');
            cellLabels.forEach(l => l.visible = showLabels);
        });
        
        document.getElementById('showPulsing').addEventListener('click', function() {
            this.classList.toggle('active');
            showPulsing = this.classList.contains('active');
        });
        
        // Mouse interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredCell = null;
        
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -((e.clientY - 150) / (window.innerHeight - 150)) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cellMeshes);
            
            cellMeshes.forEach(cell => {
                cell.material.emissiveIntensity = 0.3;
                cell.scale.set(1, 1, 1);
            });
            
            if (intersects.length > 0) {
                hoveredCell = intersects[0].object;
                hoveredCell.material.emissiveIntensity = 0.8;
                hoveredCell.scale.set(1.2, 1.2, 1.2);
            }
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight - 150);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 150);
        });
        
        // Animation loop
        let time = 0;
        const animate = () => {
            requestAnimationFrame(animate);
            time += 0.01;
            
            // Auto rotate
            if (autoRotate) {
                scene.rotation.y += 0.0003;
                scene.rotation.x += 0.0001;
            }
            
            // Pulsing effect
            if (showPulsing) {
                cellMeshes.forEach(cell => {
                    const pulse = 1 + Math.sin(time * 2 + cell.position.x) * 0.1;
                    if (cell.userData.type === 'dashboard') {
                        cell.scale.set(pulse * 1.5, pulse * 1.5, pulse * 1.5);
                    } else if (cell.userData.type === 'dna') {
                        cell.scale.set(pulse * 1.2, pulse * 1.2, pulse * 1.2);
                    } else {
                        cell.scale.set(pulse, pulse, pulse);
                    }
                });
            }
            
            // Spinning cells
            cellMeshes.forEach(cell => {
                cell.rotation.x += 0.005;
                cell.rotation.y += 0.007;
            });
            
            // Particle signals
            particles.forEach(p => {
                if (showSignals) {
                    p.userData.progress += 0.005;
                    if (p.userData.progress > 1) {
                        p.userData.progress = 0;
                    }
                    
                    const from = cellMeshes[p.userData.from];
                    const to = cellMeshes[p.userData.to];
                    const progress = (p.userData.progress + p.userData.delay) % 1;
                    
                    p.position.lerpVectors(from.position, to.position, progress);
                    p.scale.set(
                        1 + Math.sin(time * 3) * 0.3,
                        1 + Math.sin(time * 3) * 0.3,
                        1 + Math.sin(time * 3) * 0.3
                    );
                }
            });
            
            // Update line opacity
            lineSegments.forEach((seg, i) => {
                const opacity = 0.2 + 0.3 * Math.sin(time + i * 0.5);
                seg.line.material.opacity = opacity;
            });
            
            renderer.render(scene, camera);
        };
        
        animate();
    </script>
</body>
</html>
